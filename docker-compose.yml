services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"    # Jenkins UI
      - "8000:8000"    # the deployed Taskboard app
      - "50000:50000"  # inbound agents (unused here)
    volumes:
      - jenkins_home:/var/jenkins_home
      # The "SCM server": Jenkins clones the pipeline from this local git
      # repo via a file:// URL. Read-only - Jenkins clones, never writes back.
      - ./:/srv/repo:ro
    environment:
      JENKINS_URL: http://localhost:8080/

volumes:
  jenkins_home:
