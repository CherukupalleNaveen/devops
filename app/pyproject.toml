[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskboard"
version = "1.0.0"
description = "Tiny task tracker - the deployable unit in the Jenkins CD demo"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taskboard = ["templates/*.html"]

[tool.ruff]
line-length = 100
